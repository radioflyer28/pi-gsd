name: Live pi-subagents contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-model-smoke
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pi-subagents probe dependency
        run: npm install --no-save --package-lock=false pi-subagents@0.51.0

      - name: Run no-credential Pi smoke
        run: npm run test:live-pi

      - name: Run credentialed routing probe
        env:
          PI_GSD_RUN_LIVE_SUBAGENT: "1"
          PI_GSD_LIVE_MODEL: ${{ vars.PI_GSD_LIVE_MODEL }}
          PI_GSD_LIVE_API_KEY_ENV: LIVE_MODEL_API_KEY
          LIVE_MODEL_API_KEY: ${{ secrets.LIVE_MODEL_API_KEY }}
          PI_SUBAGENTS_EXTENSION: ${{ github.workspace }}/node_modules/pi-subagents/src/extension/index.ts
        run: npm run test:live-subagent
